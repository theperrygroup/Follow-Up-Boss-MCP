name: deploy-production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation to run from refs/heads/main.
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - expand
          - status
          - backfill
          - record-acceptance
          - finalize
          - rollback-finalize
      expected_access_unbound:
        description: Exact access-token NULL count from the immediately preceding status run.
        required: false
        type: string
      expected_refresh_unbound:
        description: Exact refresh-token NULL count from the immediately preceding status run.
        required: false
        type: string
      acknowledge_unbound_token_audience:
        description: Assert that every NULL-resource token targeted only this MCP resource.
        required: false
        type: boolean
        default: false
      old_writers_retired:
        description: Assert that every running ECS task uses this exact release before finalizing.
        required: false
        type: boolean
        default: false
      accepted_release_sha:
        description: Exact deployed SHA for a record-acceptance callback.
        required: false
        type: string
      accepted_task_definition_arn:
        description: Exact live-tested ECS task-definition ARN for a record-acceptance callback.
        required: false
        type: string
      modern_acceptance_evidence_sha256:
        description: SHA-256 of the sanitized authenticated modern-protocol acceptance evidence.
        required: false
        type: string
      legacy_acceptance_evidence_sha256:
        description: SHA-256 of the sanitized authenticated legacy-protocol acceptance evidence.
        required: false
        type: string
      acceptance_run_id:
        description: Successful record-acceptance workflow run ID required by finalize.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  authorize-production-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require the production ref
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            printf "Production operations may run only from refs/heads/main.\n" >&2
            exit 1
          fi

  validate:
    needs: authorize-production-ref
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOYMENT_ENVIRONMENT: ${{ vars.DEPLOYMENT_ENVIRONMENT || 'production' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      FUB_OAUTH_ENABLED: ${{ vars.FUB_OAUTH_ENABLED }}
      FUB_OAUTH_CALLBACK_URL: ${{ vars.FUB_OAUTH_CALLBACK_URL }}
      FUB_OAUTH_CLIENT_ID: ${{ vars.FUB_OAUTH_CLIENT_ID }}
      FUB_OAUTH_SYSTEM_NAME: ${{ vars.FUB_OAUTH_SYSTEM_NAME }}
      HOSTED_ISSUER_URL: ${{ vars.HOSTED_ISSUER_URL }}
      HOSTED_RESOURCE_SERVER_URL: ${{ vars.HOSTED_RESOURCE_SERVER_URL }}
      LOG_GROUP_NAME: ${{ vars.LOG_GROUP_NAME }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT || 'production' }}
      SENTRY_RELEASE: followupboss-mcp@${{ github.sha }}
      SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
      TENANT_SECRET_PREFIX: ${{ vars.TENANT_SECRET_PREFIX }}
      TENANT_SECRET_REGION: ${{ vars.TENANT_SECRET_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      FUB_OAUTH_CLIENT_SECRET_ARN: ${{ secrets.FUB_OAUTH_CLIENT_SECRET_ARN }}
      FUB_OAUTH_SYSTEM_KEY_SECRET_ARN: ${{ secrets.FUB_OAUTH_SYSTEM_KEY_SECRET_ARN }}
      REDIS_URL_SECRET_ARN: ${{ secrets.REDIS_URL_SECRET_ARN }}
      TENANT_DATABASE_URL_SECRET_ARN: ${{ secrets.TENANT_DATABASE_URL_SECRET_ARN }}
      TASK_EXECUTION_ROLE_ARN: ${{ secrets.TASK_EXECUTION_ROLE_ARN }}
      TASK_ROLE_ARN: ${{ secrets.TASK_ROLE_ARN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify production workflow configuration
        shell: bash
        run: |
          required_values=(
            AWS_REGION
            DEPLOYMENT_ENVIRONMENT
            ECR_REPOSITORY
            ECS_CLUSTER
            ECS_SERVICE
            HOSTED_ISSUER_URL
            HOSTED_RESOURCE_SERVER_URL
            LOG_GROUP_NAME
            TENANT_SECRET_PREFIX
            TENANT_SECRET_REGION
            AWS_ROLE_TO_ASSUME
            REDIS_URL_SECRET_ARN
            TENANT_DATABASE_URL_SECRET_ARN
            TASK_EXECUTION_ROLE_ARN
            TASK_ROLE_ARN
          )
          for name in "${required_values[@]}"; do
            if [ -z "${!name}" ]; then
              printf "Missing required production configuration: %s\n" "${name}" >&2
              exit 1
            fi
          done
          deployment_environment="$(printf "%s" "${DEPLOYMENT_ENVIRONMENT}" | tr '[:upper:]' '[:lower:]')"
          if [ "${deployment_environment}" != "production" ]; then
            printf "DEPLOYMENT_ENVIRONMENT must be production.\n" >&2
            exit 1
          fi
          sentry_environment="$(printf "%s" "${SENTRY_ENVIRONMENT:-production}" | tr '[:upper:]' '[:lower:]')"
          if [ "${sentry_environment}" != "production" ]; then
            printf "SENTRY_ENVIRONMENT must be production for the hosted MCP deployment.\n" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          resource_url = os.environ["HOSTED_RESOURCE_SERVER_URL"].strip()
          issuer_url = os.environ["HOSTED_ISSUER_URL"].strip()
          resource = urlparse(resource_url)
          issuer = urlparse(issuer_url)
          if (
              resource.scheme != "https"
              or not resource.netloc
              or resource.username is not None
              or resource.password is not None
              or resource.path.rstrip("/") != "/mcp"
              or resource.params
              or resource.query
              or resource.fragment
          ):
              raise SystemExit(
                  "HOSTED_RESOURCE_SERVER_URL must be the external HTTPS MCP URL ending in /mcp."
              )
          if (
              issuer.scheme != "https"
              or issuer.netloc != resource.netloc
              or issuer.username is not None
              or issuer.password is not None
              or issuer.path not in ("", "/")
              or issuer.params
              or issuer.query
              or issuer.fragment
          ):
              raise SystemExit(
                  "HOSTED_ISSUER_URL must be the HTTPS origin for HOSTED_RESOURCE_SERVER_URL."
              )
          PY
          oauth_enabled="$(printf "%s" "${FUB_OAUTH_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')"
          case "${oauth_enabled}" in
            true|false) ;;
            *)
              printf "FUB_OAUTH_ENABLED must be true or false when set.\n" >&2
              exit 1
              ;;
          esac
          if [ "${oauth_enabled}" = "true" ]; then
            oauth_required_values=(
              FUB_OAUTH_CALLBACK_URL
              FUB_OAUTH_CLIENT_ID
              FUB_OAUTH_SYSTEM_NAME
              FUB_OAUTH_CLIENT_SECRET_ARN
              FUB_OAUTH_SYSTEM_KEY_SECRET_ARN
            )
            for name in "${oauth_required_values[@]}"; do
              if [ -z "${!name}" ]; then
                printf "Missing required production OAuth configuration: %s\n" "${name}" >&2
                exit 1
              fi
            done
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run release validation
        run: make release-validate

  record-live-acceptance:
    needs:
      - authorize-production-ref
      - validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'record-acceptance'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      HOSTED_RESOURCE_SERVER_URL: ${{ vars.HOSTED_RESOURCE_SERVER_URL }}
      ACCEPTED_RELEASE_SHA: ${{ inputs.accepted_release_sha }}
      ACCEPTED_TASK_DEFINITION_ARN: ${{ inputs.accepted_task_definition_arn }}
      MODERN_ACCEPTANCE_EVIDENCE_SHA256: ${{ inputs.modern_acceptance_evidence_sha256 }}
      LEGACY_ACCEPTANCE_EVIDENCE_SHA256: ${{ inputs.legacy_acceptance_evidence_sha256 }}
    steps:
      - name: Validate the authenticated acceptance callback
        shell: bash
        run: |
          if [ "${ACCEPTED_RELEASE_SHA}" != "${GITHUB_SHA}" ]; then
            printf "Acceptance callback must target this exact main-branch SHA.\n" >&2
            exit 1
          fi
          if [ -z "${ACCEPTED_TASK_DEFINITION_ARN}" ]; then
            printf "Acceptance callback requires the exact live-tested task-definition ARN.\n" >&2
            exit 1
          fi
          if ! [[ "${MODERN_ACCEPTANCE_EVIDENCE_SHA256}" =~ ^[0-9a-f]{64}$ ]] ||
             ! [[ "${LEGACY_ACCEPTANCE_EVIDENCE_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            printf "Acceptance callback requires separate lowercase SHA-256 evidence digests for modern and legacy authenticated probes.\n" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Bind the acceptance callback to the live ECS release
        shell: bash
        run: |
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}" > "${RUNNER_TEMP}/acceptance-service.json"
          service_count="$(jq -r '.services | length' "${RUNNER_TEMP}/acceptance-service.json")"
          failure_count="$(jq -r '.failures | length' "${RUNNER_TEMP}/acceptance-service.json")"
          desired="$(jq -r '.services[0].desiredCount // 0' "${RUNNER_TEMP}/acceptance-service.json")"
          running="$(jq -r '.services[0].runningCount // 0' "${RUNNER_TEMP}/acceptance-service.json")"
          pending="$(jq -r '.services[0].pendingCount // 0' "${RUNNER_TEMP}/acceptance-service.json")"
          deployments="$(jq -r '.services[0].deployments | length' "${RUNNER_TEMP}/acceptance-service.json")"
          rollout_state="$(jq -r '.services[0].deployments[0].rolloutState // empty' "${RUNNER_TEMP}/acceptance-service.json")"
          rollback_enabled="$(jq -r '.services[0].deploymentConfiguration.deploymentCircuitBreaker | .enable == true and .rollback == true' "${RUNNER_TEMP}/acceptance-service.json")"
          service_task_definition="$(jq -r '.services[0].taskDefinition // empty' "${RUNNER_TEMP}/acceptance-service.json")"
          if [ "${service_count}" != "1" ] || [ "${failure_count}" != "0" ] ||
             [ "${desired}" = "0" ] || [ "${running}" != "${desired}" ] ||
             [ "${pending}" != "0" ] || [ "${deployments}" != "1" ] ||
             [ "${rollout_state}" != "COMPLETED" ] || [ "${rollback_enabled}" != "true" ] ||
             [ "${service_task_definition}" != "${ACCEPTED_TASK_DEFINITION_ARN}" ]; then
            printf "Acceptance callback does not match one stable live ECS release.\n" >&2
            exit 1
          fi
          aws ecs describe-task-definition \
            --task-definition "${service_task_definition}" \
            --region "${AWS_REGION}" > "${RUNNER_TEMP}/acceptance-task-definition.json"
          release="$(
            jq -r '
              .taskDefinition.containerDefinitions[]
              | select(.name == "followupboss-mcp-hosted")
              | .environment[]
              | select(.name == "SENTRY_RELEASE")
              | .value
            ' "${RUNNER_TEMP}/acceptance-task-definition.json"
          )"
          running_resource="$(
            jq -r '
              .taskDefinition.containerDefinitions[]
              | select(.name == "followupboss-mcp-hosted")
              | .environment[]
              | select(.name == "FOLLOWUPBOSS_HOSTED_RESOURCE_SERVER_URL")
              | .value
            ' "${RUNNER_TEMP}/acceptance-task-definition.json"
          )"
          if [ "${release}" != "followupboss-mcp@${GITHUB_SHA}" ] ||
             [ "${running_resource}" != "${HOSTED_RESOURCE_SERVER_URL}" ]; then
            printf "Acceptance callback release metadata does not match the selected ref and resource.\n" >&2
            exit 1
          fi
          aws ecs list-tasks \
            --cluster "${ECS_CLUSTER}" \
            --service-name "${ECS_SERVICE}" \
            --desired-status RUNNING \
            --max-results 100 \
            --region "${AWS_REGION}" > "${RUNNER_TEMP}/acceptance-task-arns.json"
          listed="$(jq -r '.taskArns | length' "${RUNNER_TEMP}/acceptance-task-arns.json")"
          next_token="$(jq -r '.nextToken // empty' "${RUNNER_TEMP}/acceptance-task-arns.json")"
          if [ "${listed}" != "${desired}" ] || [ -n "${next_token}" ]; then
            printf "Acceptance callback could not prove the complete running task set.\n" >&2
            exit 1
          fi
          jq -r '.taskArns[]' "${RUNNER_TEMP}/acceptance-task-arns.json" > "${RUNNER_TEMP}/acceptance-task-arns.txt"
          aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" \
            --tasks $(<"${RUNNER_TEMP}/acceptance-task-arns.txt") \
            --region "${AWS_REGION}" > "${RUNNER_TEMP}/acceptance-tasks.json"
          described="$(jq -r '.tasks | length' "${RUNNER_TEMP}/acceptance-tasks.json")"
          task_failures="$(jq -r '.failures | length' "${RUNNER_TEMP}/acceptance-tasks.json")"
          mismatches="$(jq --arg expected "${service_task_definition}" '[.tasks[] | select(.lastStatus != "RUNNING" or .taskDefinitionArn != $expected)] | length' "${RUNNER_TEMP}/acceptance-tasks.json")"
          if [ "${described}" != "${desired}" ] || [ "${task_failures}" != "0" ] ||
             [ "${mismatches}" != "0" ]; then
            printf "Acceptance callback found a mixed or incomplete running task set.\n" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema": "followupboss-mcp-production-live-acceptance-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "release_sha": os.environ["GITHUB_SHA"],
              "task_definition_arn": os.environ["ACCEPTED_TASK_DEFINITION_ARN"],
              "resource": os.environ["HOSTED_RESOURCE_SERVER_URL"],
              "attested_by": os.environ["GITHUB_ACTOR"],
              "modern_acceptance_evidence_sha256": os.environ[
                  "MODERN_ACCEPTANCE_EVIDENCE_SHA256"
              ],
              "legacy_acceptance_evidence_sha256": os.environ[
                  "LEGACY_ACCEPTANCE_EVIDENCE_SHA256"
              ],
          }
          Path(os.environ["RUNNER_TEMP"], "production-live-acceptance.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          printf "Acceptance callback receipt: run=%s attempt=%s release=%s task_definition=%s.\n" \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${GITHUB_SHA}" "${service_task_definition}"

      - name: Publish the immutable acceptance callback receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-live-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-live-acceptance.json
          if-no-files-found: error
          retention-days: 90

  oauth-resource-migration:
    needs:
      - authorize-production-ref
      - validate
    permissions:
      actions: read
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation != 'record-acceptance')
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      HOSTED_RESOURCE_SERVER_URL: ${{ vars.HOSTED_RESOURCE_SERVER_URL }}
      LOG_GROUP_NAME: ${{ vars.LOG_GROUP_NAME }}
      TASK_EXECUTION_ROLE_ARN: ${{ secrets.TASK_EXECUTION_ROLE_ARN }}
      TASK_ROLE_ARN: ${{ secrets.TASK_ROLE_ARN }}
      TENANT_DATABASE_URL_SECRET_ARN: ${{ secrets.TENANT_DATABASE_URL_SECRET_ARN }}
      REQUESTED_OPERATION: ${{ github.event_name == 'push' && 'verify-ready' || inputs.operation == 'deploy' && 'verify-ready' || inputs.operation }}
      EXPECTED_ACCESS_UNBOUND: ${{ inputs.expected_access_unbound }}
      EXPECTED_REFRESH_UNBOUND: ${{ inputs.expected_refresh_unbound }}
      ACKNOWLEDGE_UNBOUND_TOKEN_AUDIENCE: ${{ inputs.acknowledge_unbound_token_audience }}
      OLD_WRITERS_RETIRED: ${{ inputs.old_writers_retired }}
      ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate migration request
        shell: bash
        run: |
          required_values=(
            AWS_REGION
            AWS_ROLE_TO_ASSUME
            ECR_REPOSITORY
            ECS_CLUSTER
            ECS_SERVICE
            HOSTED_RESOURCE_SERVER_URL
            LOG_GROUP_NAME
            TASK_EXECUTION_ROLE_ARN
            TASK_ROLE_ARN
            TENANT_DATABASE_URL_SECRET_ARN
          )
          for name in "${required_values[@]}"; do
            if [ -z "${!name}" ]; then
              printf "Missing required production migration configuration: %s\n" "${name}" >&2
              exit 1
            fi
          done
          case "${REQUESTED_OPERATION}" in
            expand|status|verify-ready|backfill|finalize|rollback-finalize) ;;
            *)
              printf "Unsupported production operation.\n" >&2
              exit 1
              ;;
          esac
          if [ "${REQUESTED_OPERATION}" = "backfill" ]; then
            if ! [[ "${EXPECTED_ACCESS_UNBOUND}" =~ ^[0-9]+$ ]] ||
               ! [[ "${EXPECTED_REFRESH_UNBOUND}" =~ ^[0-9]+$ ]]; then
              printf "Backfill requires exact non-negative status counts.\n" >&2
              exit 1
            fi
            if [ "${ACKNOWLEDGE_UNBOUND_TOKEN_AUDIENCE}" != "true" ]; then
              printf "Backfill requires the explicit audience acknowledgement.\n" >&2
              exit 1
            fi
          fi
          if [ "${REQUESTED_OPERATION}" = "finalize" ] &&
             [ "${OLD_WRITERS_RETIRED}" != "true" ]; then
            printf "Finalize requires the old-writers-retired acknowledgement.\n" >&2
            exit 1
          fi
          if [ "${REQUESTED_OPERATION}" = "finalize" ] &&
             ! [[ "${ACCEPTANCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            printf "Finalize requires the successful record-acceptance workflow run ID.\n" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ["HOSTED_RESOURCE_SERVER_URL"].strip()
          resource = urlparse(value)
          if (
              resource.scheme != "https"
              or not resource.netloc
              or resource.path.rstrip("/") != "/mcp"
              or resource.params
              or resource.query
              or resource.fragment
          ):
              raise SystemExit(
                  "HOSTED_RESOURCE_SERVER_URL must be the external HTTPS MCP URL ending in /mcp."
              )
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Resolve the immutable live-acceptance callback
        if: env.REQUESTED_OPERATION == 'finalize'
        shell: bash
        run: |
          receipt_dir="${RUNNER_TEMP}/accepted-live-receipt"
          artifact_name=""
          mkdir -p "${receipt_dir}"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ACCEPTANCE_RUN_ID}" \
            > "${RUNNER_TEMP}/acceptance-run.json"
          run_attempt="$(jq -r '.run_attempt // 0' "${RUNNER_TEMP}/acceptance-run.json")"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg sha "${GITHUB_SHA}" \
            --argjson run_id "${ACCEPTANCE_RUN_ID}" '
              .id == $run_id
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and .head_branch == "main"
              and .head_sha == $sha
              and .path == ".github/workflows/deploy-production.yml"
              and .repository.full_name == $repository
              and (.run_attempt | type == "number" and . > 0)
            ' "${RUNNER_TEMP}/acceptance-run.json" > /dev/null
          artifact_name="production-live-acceptance-${ACCEPTANCE_RUN_ID}-${run_attempt}"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ACCEPTANCE_RUN_ID}/artifacts?per_page=100" \
            > "${RUNNER_TEMP}/acceptance-artifacts.json"
          artifact_count="$(
            jq --arg name "${artifact_name}" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
              "${RUNNER_TEMP}/acceptance-artifacts.json"
          )"
          if [ "${artifact_count}" != "1" ]; then
            printf "Finalize requires one unexpired immutable acceptance artifact from the accepted run.\n" >&2
            exit 1
          fi
          gh run download "${ACCEPTANCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${artifact_name}" \
            --dir "${receipt_dir}"
          receipt_path="${receipt_dir}/production-live-acceptance.json"
          if [ ! -f "${receipt_path}" ]; then
            printf "Acceptance artifact did not contain the required receipt.\n" >&2
            exit 1
          fi
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg ref "${GITHUB_REF}" \
            --arg sha "${GITHUB_SHA}" \
            --arg resource "${HOSTED_RESOURCE_SERVER_URL}" \
            --argjson run_id "${ACCEPTANCE_RUN_ID}" \
            --argjson run_attempt "${run_attempt}" '
              keys == [
                "attested_by",
                "event",
                "legacy_acceptance_evidence_sha256",
                "modern_acceptance_evidence_sha256",
                "ref",
                "release_sha",
                "repository",
                "resource",
                "schema",
                "task_definition_arn",
                "workflow_run_attempt",
                "workflow_run_id"
              ]
              and .schema == "followupboss-mcp-production-live-acceptance-v1"
              and .repository == $repository
              and .workflow_run_id == $run_id
              and .workflow_run_attempt == $run_attempt
              and .event == "workflow_dispatch"
              and .ref == $ref
              and .release_sha == $sha
              and .resource == $resource
              and (.attested_by | type == "string" and length > 0)
              and (.task_definition_arn | type == "string" and length > 0)
              and (.modern_acceptance_evidence_sha256 | test("^[0-9a-f]{64}$"))
              and (.legacy_acceptance_evidence_sha256 | test("^[0-9a-f]{64}$"))
            ' "${receipt_path}" > /dev/null
          printf "Resolved authenticated live-acceptance callback: run=%s attempt=%s.\n" \
            "${ACCEPTANCE_RUN_ID}" "${run_attempt}"

      - name: Verify or explicitly adopt one database secret version
        shell: bash
        run: |
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}" > "${RUNNER_TEMP}/production-service.json"
          service_count="$(jq -r '.services | length' "${RUNNER_TEMP}/production-service.json")"
          failure_count="$(jq -r '.failures | length' "${RUNNER_TEMP}/production-service.json")"
