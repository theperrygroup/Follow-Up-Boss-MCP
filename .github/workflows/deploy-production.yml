            "${desired}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push migration image
        id: build-migration-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.migration
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:oauth-resource-migration-${{ github.sha }}
          cache-from: type=gha,scope=oauth-resource-migration
          cache-to: type=gha,mode=max,scope=oauth-resource-migration

      - name: Render and register migration task definition
        id: register-migration-task
        shell: bash
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build-migration-image.outputs.digest }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from typing import Any

          def replace(value: Any, replacements: dict[str, str]) -> Any:
              if isinstance(value, str):
                  rendered = value
                  for placeholder, replacement in replacements.items():
                      rendered = rendered.replace(placeholder, replacement)
                  return rendered
              if isinstance(value, list):
                  return [replace(item, replacements) for item in value]
              if isinstance(value, dict):
                  return {key: replace(item, replacements) for key, item in value.items()}
              return value

          template = json.loads(
              Path("deploy/ecs/task-definition.migration.template.json").read_text(
                  encoding="utf-8"
              )
          )
          rendered = replace(
              template,
              {
                  "__AWS_REGION__": os.environ["AWS_REGION"],
                  "__HOSTED_RESOURCE_SERVER_URL__": os.environ[
                      "HOSTED_RESOURCE_SERVER_URL"
                  ],
                  "__IMAGE_URI__": os.environ["IMAGE_URI"],
                  "__LOG_GROUP_NAME__": os.environ["LOG_GROUP_NAME"],
                  "__TASK_EXECUTION_ROLE_ARN__": os.environ[
                      "TASK_EXECUTION_ROLE_ARN"
                  ],
                  "__TENANT_DATABASE_URL_SECRET_ARN__": os.environ[
                      "PINNED_TENANT_DATABASE_URL_SECRET_ARN"
                  ],
              },
          )
          rendered_text = json.dumps(rendered, indent=2) + "\n"
          missing = sorted(set(re.findall(r"__[A-Z0-9_]+__", rendered_text)))
          if missing:
              raise SystemExit(f"Unrendered migration placeholders remain: {missing}")
          Path(os.environ["RUNNER_TEMP"], "migration-task-definition.json").write_text(
              rendered_text,
              encoding="utf-8",
          )
          PY
          aws ecs register-task-definition --cli-input-json "file://${RUNNER_TEMP}/migration-task-definition.json" --region "${AWS_REGION}" > "${RUNNER_TEMP}/registered-migration-task.json"
          task_definition_arn="$(
            jq -r '.taskDefinition.taskDefinitionArn // empty' "${RUNNER_TEMP}/registered-migration-task.json"
          )"
          if [ -z "${task_definition_arn}" ]; then
            printf "Migration task-definition registration did not return an ARN.\n" >&2
            exit 1
          fi
          printf "task_definition_arn=%s\n" "${task_definition_arn}" >> "${GITHUB_OUTPUT}"

      - name: Verify the finalization release boundary
        if: env.REQUESTED_OPERATION == 'finalize'
        shell: bash
        run: |
          receipt_path="${RUNNER_TEMP}/accepted-live-receipt/production-live-acceptance.json"
          accepted_task_definition="$(jq -r '.task_definition_arn' "${receipt_path}")"
          service_json="${RUNNER_TEMP}/finalize-service-before.json"
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}" > "${service_json}"
          service_count="$(jq -r '.services | length' "${service_json}")"
          failure_count="$(jq -r '.failures | length' "${service_json}")"
          desired="$(jq -r '.services[0].desiredCount // 0' "${service_json}")"
          running="$(jq -r '.services[0].runningCount // 0' "${service_json}")"
          pending="$(jq -r '.services[0].pendingCount // 0' "${service_json}")"
          deployments="$(jq -r '.services[0].deployments | length' "${service_json}")"
          rollout_state="$(jq -r '.services[0].deployments[0].rolloutState // empty' "${service_json}")"
          deployment_controller="$(jq -r '.services[0].deploymentController.type // empty' "${service_json}")"
          rollback_enabled="$(jq -r '.services[0].deploymentConfiguration.deploymentCircuitBreaker | .enable == true and .rollback == true' "${service_json}")"
          service_task_definition="$(jq -r '.services[0].taskDefinition // empty' "${service_json}")"
          if [ "${service_task_definition}" != "${accepted_task_definition}" ]; then
            printf "Finalize task definition does not match the authenticated live acceptance.\n" >&2
            exit 1
          fi
          if [ "${service_count}" != "1" ] || [ "${failure_count}" != "0" ] ||
             [ "${desired}" = "0" ] || [ "${deployments}" != "1" ] ||
             [ "${pending}" != "0" ] || [ "${running}" != "${desired}" ] ||
             [ "${rollout_state}" != "COMPLETED" ] ||
             [ "${deployment_controller}" != "ECS" ] ||
             [ "${rollback_enabled}" != "true" ]; then
            printf "Finalize requires one stable completed ECS deployment.\n" >&2
            exit 1
          fi
          aws ecs describe-task-definition \
            --task-definition "${service_task_definition}" \
            --region "${AWS_REGION}" > "${RUNNER_TEMP}/finalize-task-definition.json"
          release="$(
            jq -r '
              .taskDefinition.containerDefinitions[]
              | select(.name == "followupboss-mcp-hosted")
              | .environment[]
              | select(.name == "SENTRY_RELEASE")
              | .value
            ' "${RUNNER_TEMP}/finalize-task-definition.json"
          )"
          running_resource="$(
            jq -r '
              .taskDefinition.containerDefinitions[]
              | select(.name == "followupboss-mcp-hosted")
              | .environment[]
              | select(.name == "FOLLOWUPBOSS_HOSTED_RESOURCE_SERVER_URL")
              | .value
            ' "${RUNNER_TEMP}/finalize-task-definition.json"
          )"
          if [ "${release}" != "followupboss-mcp@${GITHUB_SHA}" ] ||
             [ "${running_resource}" != "${HOSTED_RESOURCE_SERVER_URL}" ]; then
            printf "Finalize ref does not match the running production release.\n" >&2
            exit 1
          fi
          aws ecs list-tasks \
            --cluster "${ECS_CLUSTER}" \
            --service-name "${ECS_SERVICE}" \
            --desired-status RUNNING \
            --max-results 100 \
            --region "${AWS_REGION}" > "${RUNNER_TEMP}/running-task-arns.json"
          running_task_count="$(jq -r '.taskArns | length' "${RUNNER_TEMP}/running-task-arns.json")"
          next_token="$(jq -r '.nextToken // empty' "${RUNNER_TEMP}/running-task-arns.json")"
          if [ "${running_task_count}" != "${desired}" ] ||
             [ "${running_task_count}" = "0" ] || [ -n "${next_token}" ]; then
            printf "Finalize could not prove the complete running task set.\n" >&2
            exit 1
          fi
          jq -r '.taskArns[]' "${RUNNER_TEMP}/running-task-arns.json" > "${RUNNER_TEMP}/running-task-arns.txt"
          aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks $(<"${RUNNER_TEMP}/running-task-arns.txt") --region "${AWS_REGION}" > "${RUNNER_TEMP}/running-tasks.json"
          described_task_count="$(jq -r '.tasks | length' "${RUNNER_TEMP}/running-tasks.json")"
          described_failure_count="$(jq -r '.failures | length' "${RUNNER_TEMP}/running-tasks.json")"
          nonrunning_count="$(jq '[.tasks[] | select(.lastStatus != "RUNNING")] | length' "${RUNNER_TEMP}/running-tasks.json")"
          if [ "${described_failure_count}" != "0" ] ||
             [ "${described_task_count}" != "${desired}" ] || [ "${nonrunning_count}" != "0" ]; then
            printf "Finalize could not revalidate every running production task.\n" >&2
            exit 1
          fi
          mismatches="$(
            jq --arg expected "${service_task_definition}" '[.tasks[] | select(.taskDefinitionArn != $expected)] | length' "${RUNNER_TEMP}/running-tasks.json"
          )"
          if [ "${mismatches}" != "0" ]; then
            printf "Finalize found a running task on an older task definition.\n" >&2
            exit 1
          fi
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}" > "${RUNNER_TEMP}/finalize-service-after.json"
          jq -e \
            --arg expected "${service_task_definition}" \
            --argjson desired "${desired}" '
              (.failures | length) == 0
              and (.services | length) == 1
              and .services[0].taskDefinition == $expected
              and .services[0].desiredCount == $desired
              and .services[0].runningCount == $desired
              and .services[0].pendingCount == 0
              and (.services[0].deployments | length) == 1
              and .services[0].deployments[0].rolloutState == "COMPLETED"
              and .services[0].deploymentController.type == "ECS"
              and .services[0].deploymentConfiguration.deploymentCircuitBreaker.enable == true
              and .services[0].deploymentConfiguration.deploymentCircuitBreaker.rollback == true
            ' "${RUNNER_TEMP}/finalize-service-after.json" > /dev/null
          printf "Verified %s running task(s) on release %s.\n" "${running_task_count}" "${release}"

      - name: Run the migration task and publish a sanitized receipt
        shell: bash
        env:
          MIGRATION_TASK_DEFINITION_ARN: ${{ steps.register-migration-task.outputs.task_definition_arn }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          phase = os.environ["REQUESTED_OPERATION"]
          command = ["verify-ready" if phase == "verify-ready" else phase]
          command.extend(["--resource", os.environ["HOSTED_RESOURCE_SERVER_URL"]])
          if phase in {"expand", "backfill", "finalize", "rollback-finalize"}:
              command.append("--apply")
          if phase == "backfill":
              command.extend(
                  [
                      "--expect-access-unbound",
                      os.environ["EXPECTED_ACCESS_UNBOUND"],
                      "--expect-refresh-unbound",
                      os.environ["EXPECTED_REFRESH_UNBOUND"],
                      "--acknowledge-unbound-token-audience",
                  ]
              )
          if phase == "finalize":
              command.append("--old-writers-retired")
          overrides = {
              "containerOverrides": [
                  {
                      "name": "oauth-resource-migration",
                      "command": command,
                  }
              ]
          }
          Path(os.environ["RUNNER_TEMP"], "migration-overrides.json").write_text(
              json.dumps(overrides),
              encoding="utf-8",
          )
          PY
          aws ecs run-task --cluster "${ECS_CLUSTER}" --task-definition "${MIGRATION_TASK_DEFINITION_ARN}" --launch-type FARGATE --network-configuration "file://${RUNNER_TEMP}/migration-network.json" --overrides "file://${RUNNER_TEMP}/migration-overrides.json" --region "${AWS_REGION}" > "${RUNNER_TEMP}/migration-run-task.json"
          if [ "$(jq -r '.failures | length' "${RUNNER_TEMP}/migration-run-task.json")" != "0" ]; then
            printf "ECS rejected the migration task. Review private AWS control-plane logs.\n" >&2
            exit 1
          fi
          task_arn="$(jq -r '.tasks[0].taskArn // empty' "${RUNNER_TEMP}/migration-run-task.json")"
          if [ -z "${task_arn}" ]; then
            printf "ECS did not return a migration task ARN.\n" >&2
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${task_arn}" --region "${AWS_REGION}"
          aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks "${task_arn}" --region "${AWS_REGION}" > "${RUNNER_TEMP}/migration-task-result.json"
          exit_code="$(
            jq -r '
              .tasks[0].containers[]
              | select(.name == "oauth-resource-migration")
              | .exitCode // empty
            ' "${RUNNER_TEMP}/migration-task-result.json"
          )"
          task_id="${task_arn##*/}"
          log_stream="migration/oauth-resource-migration/${task_id}"
          receipt=""
          for _ in $(seq 1 20); do
            if aws logs get-log-events --log-group-name "${LOG_GROUP_NAME}" --log-stream-name "${log_stream}" --region "${AWS_REGION}" > "${RUNNER_TEMP}/migration-log-events.json" 2>/dev/null; then
              receipt="$(
                jq -r '
                  .events[].message
                  | select(startswith("MIGRATION_RECEIPT="))
                ' "${RUNNER_TEMP}/migration-log-events.json" | tail -n 1
              )"
              if [ -n "${receipt}" ]; then
                break
              fi
            fi
            sleep 2
          done
          if [ "${exit_code}" != "0" ]; then
            printf "Migration task failed with exit code %s; raw database output was suppressed. Verify state with a status operation before retrying.\n" "${exit_code:-unknown}" >&2
            exit 1
          fi
          if [ -z "${receipt}" ]; then
            printf "Migration succeeded but no sanitized receipt was readable; failing closed.\n" >&2
            exit 1
          fi
          receipt_json="${receipt#MIGRATION_RECEIPT=}"
          printf "%s" "${receipt_json}" > "${RUNNER_TEMP}/migration-receipt.json"
          jq -e --arg phase "${REQUESTED_OPERATION}" --arg resource "${HOSTED_RESOURCE_SERVER_URL}" '
              .phase == $phase
              and .resource == $resource
              and (.access.total_rows | type == "number")
              and (.access.unbound_rows | type == "number")
              and (.access.expected_resource_rows | type == "number")
              and (.access.foreign_resource_rows | type == "number")
              and (.refresh.total_rows | type == "number")
              and (.refresh.unbound_rows | type == "number")
              and (.refresh.expected_resource_rows | type == "number")
              and (.refresh.foreign_resource_rows | type == "number")
            ' "${RUNNER_TEMP}/migration-receipt.json" > /dev/null
          printf "Sanitized migration receipt: "
          jq -c . "${RUNNER_TEMP}/migration-receipt.json"

  deploy:
    needs:
      - validate
      - oauth-resource-migration
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'deploy')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOYMENT_ENVIRONMENT: ${{ vars.DEPLOYMENT_ENVIRONMENT || 'production' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      FUB_OAUTH_ENABLED: ${{ vars.FUB_OAUTH_ENABLED }}
      FUB_OAUTH_CALLBACK_URL: ${{ vars.FUB_OAUTH_CALLBACK_URL }}
      FUB_OAUTH_CLIENT_ID: ${{ vars.FUB_OAUTH_CLIENT_ID }}
      FUB_OAUTH_SYSTEM_NAME: ${{ vars.FUB_OAUTH_SYSTEM_NAME }}
      HOSTED_ISSUER_URL: ${{ vars.HOSTED_ISSUER_URL }}
      HOSTED_RESOURCE_SERVER_URL: ${{ vars.HOSTED_RESOURCE_SERVER_URL }}
      LOG_GROUP_NAME: ${{ vars.LOG_GROUP_NAME }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT || 'production' }}
      SENTRY_RELEASE: followupboss-mcp@${{ github.sha }}
      SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
      TENANT_SECRET_PREFIX: ${{ vars.TENANT_SECRET_PREFIX }}
      TENANT_SECRET_REGION: ${{ vars.TENANT_SECRET_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      FUB_OAUTH_CLIENT_SECRET_ARN: ${{ secrets.FUB_OAUTH_CLIENT_SECRET_ARN }}
      FUB_OAUTH_SYSTEM_KEY_SECRET_ARN: ${{ secrets.FUB_OAUTH_SYSTEM_KEY_SECRET_ARN }}
      REDIS_URL_SECRET_ARN: ${{ secrets.REDIS_URL_SECRET_ARN }}
      TENANT_DATABASE_URL_SECRET_ARN: ${{ secrets.TENANT_DATABASE_URL_SECRET_ARN }}
      TASK_EXECUTION_ROLE_ARN: ${{ secrets.TASK_EXECUTION_ROLE_ARN }}
      TASK_ROLE_ARN: ${{ secrets.TASK_ROLE_ARN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Reuse the verified version-pinned database target
        shell: bash
        run: |
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}" > "${RUNNER_TEMP}/predeploy-service.json"
          service_count="$(jq -r '.services | length' "${RUNNER_TEMP}/predeploy-service.json")"
          failure_count="$(jq -r '.failures | length' "${RUNNER_TEMP}/predeploy-service.json")"
          desired="$(jq -r '.services[0].desiredCount // 0' "${RUNNER_TEMP}/predeploy-service.json")"
          running="$(jq -r '.services[0].runningCount // 0' "${RUNNER_TEMP}/predeploy-service.json")"
          pending="$(jq -r '.services[0].pendingCount // 0' "${RUNNER_TEMP}/predeploy-service.json")"
          deployments="$(jq -r '.services[0].deployments | length' "${RUNNER_TEMP}/predeploy-service.json")"
          rollout_state="$(jq -r '.services[0].deployments[0].rolloutState // empty' "${RUNNER_TEMP}/predeploy-service.json")"
          task_definition="$(jq -r '.services[0].taskDefinition // empty' "${RUNNER_TEMP}/predeploy-service.json")"
          if [ "${service_count}" != "1" ] || [ "${failure_count}" != "0" ] ||
             [ "${desired}" = "0" ] || [ "${running}" != "${desired}" ] ||
             [ "${pending}" != "0" ] || [ "${deployments}" != "1" ] ||
             [ "${rollout_state}" != "COMPLETED" ] || [ -z "${task_definition}" ]; then
            printf "Deploy requires the stable version-pinned production service.\n" >&2
            exit 1
          fi
          aws ecs describe-task-definition \
            --task-definition "${task_definition}" \
            --region "${AWS_REGION}" > "${RUNNER_TEMP}/predeploy-task-definition.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          payload = json.loads(
              (temp / "predeploy-task-definition.json").read_text(encoding="utf-8")
          )
          containers = [
              item
              for item in payload["taskDefinition"].get("containerDefinitions", [])
              if item.get("name") == "followupboss-mcp-hosted"
          ]
          if len(containers) != 1:
              raise SystemExit("Pinned task definition did not contain one hosted container.")
          container = containers[0]
          resources = [
              item.get("value")
              for item in container.get("environment", [])
              if item.get("name") == "FOLLOWUPBOSS_HOSTED_RESOURCE_SERVER_URL"
          ]
          database_refs = [
              item.get("valueFrom", "")
              for item in container.get("secrets", [])
              if item.get("name") == "FOLLOWUPBOSS_TENANT_DATABASE_URL"
          ]
          base_secret_arn = os.environ["TENANT_DATABASE_URL_SECRET_ARN"]
          prefix = f"{base_secret_arn}:::"
          if resources != [os.environ["HOSTED_RESOURCE_SERVER_URL"]] or len(database_refs) != 1:
              raise SystemExit("Pinned task definition did not retain the migration target.")
          version = database_refs[0].removeprefix(prefix)
          if not database_refs[0].startswith(prefix) or not version or ":" in version:
              raise SystemExit("Database target was not pinned to one immutable secret version.")
          pin_path = temp / "predeploy-pinned-database-secret-arn.txt"
          pin_path.write_text(database_refs[0], encoding="utf-8")
          pin_path.chmod(0o600)
          PY
          printf "PINNED_TENANT_DATABASE_URL_SECRET_ARN=%s\n" \
            "$(<"${RUNNER_TEMP}/predeploy-pinned-database-secret-arn.txt")" >> "${GITHUB_ENV}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push hosted image
        id: build-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:production
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}

      - name: Prepare immutable image reference
        id: image-ref
        shell: bash
        run: |
          printf "image_uri=%s/%s@%s\n" \
            "${{ steps.login-ecr.outputs.registry }}" \
            "${ECR_REPOSITORY}" \
            "${{ steps.build-image.outputs.digest }}" >> "${GITHUB_OUTPUT}"

      - name: Render ECS task definition
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image-ref.outputs.image_uri }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from typing import Any

          def replace_placeholders(value: Any, replacements: dict[str, str]) -> Any:
              """Replace placeholders in an ECS task-definition object.

              Args:
                  value: JSON-compatible task-definition value.
                  replacements: Placeholder-to-value mapping.

              Returns:
                  JSON-compatible value with string placeholders replaced.
              """
              if isinstance(value, str):
                  rendered = value
                  for placeholder, replacement in replacements.items():
                      rendered = rendered.replace(placeholder, replacement)
                  return rendered
              if isinstance(value, list):
                  return [replace_placeholders(item, replacements) for item in value]
              if isinstance(value, dict):
                  return {
                      key: replace_placeholders(item, replacements)
                      for key, item in value.items()
                  }
              return value

          oauth_enabled = (os.environ.get("FUB_OAUTH_ENABLED") or "false").strip().lower()
          if oauth_enabled not in {"true", "false"}:
              raise SystemExit("FUB_OAUTH_ENABLED must be true or false when set.")

          replacements = {
              "__AWS_REGION__": os.environ["AWS_REGION"],
              "__DEPLOYMENT_ENVIRONMENT__": os.environ.get("DEPLOYMENT_ENVIRONMENT")
              or "production",
              "__FUB_OAUTH_ENABLED__": oauth_enabled,
              "__HOSTED_ISSUER_URL__": os.environ["HOSTED_ISSUER_URL"],
              "__HOSTED_RESOURCE_SERVER_URL__": os.environ["HOSTED_RESOURCE_SERVER_URL"],
              "__IMAGE_URI__": os.environ["IMAGE_URI"],
              "__LOG_GROUP_NAME__": os.environ["LOG_GROUP_NAME"],
              "__REDIS_URL_SECRET_ARN__": os.environ["REDIS_URL_SECRET_ARN"],
              "__SENTRY_DSN__": os.environ.get("SENTRY_DSN", ""),
              "__SENTRY_ENVIRONMENT__": os.environ.get("SENTRY_ENVIRONMENT")
              or "production",
              "__SENTRY_RELEASE__": os.environ.get("SENTRY_RELEASE")
              or f"followupboss-mcp@{os.environ['GITHUB_SHA']}",
              "__SENTRY_TRACES_SAMPLE_RATE__": os.environ.get("SENTRY_TRACES_SAMPLE_RATE", ""),
              "__TASK_EXECUTION_ROLE_ARN__": os.environ["TASK_EXECUTION_ROLE_ARN"],
              "__TASK_ROLE_ARN__": os.environ["TASK_ROLE_ARN"],
              "__TENANT_DATABASE_URL_SECRET_ARN__": os.environ[
                  "PINNED_TENANT_DATABASE_URL_SECRET_ARN"
              ],
              "__TENANT_SECRET_PREFIX__": os.environ["TENANT_SECRET_PREFIX"],
              "__TENANT_SECRET_REGION__": os.environ["TENANT_SECRET_REGION"],
          }
          if oauth_enabled == "true":
              replacements.update(
                  {
                      "__FUB_OAUTH_CALLBACK_URL__": os.environ["FUB_OAUTH_CALLBACK_URL"],
                      "__FUB_OAUTH_CLIENT_ID__": os.environ["FUB_OAUTH_CLIENT_ID"],
                      "__FUB_OAUTH_CLIENT_SECRET_ARN__": os.environ[
                          "FUB_OAUTH_CLIENT_SECRET_ARN"
                      ],
                      "__FUB_OAUTH_SYSTEM_KEY_SECRET_ARN__": os.environ[
                          "FUB_OAUTH_SYSTEM_KEY_SECRET_ARN"
                      ],
                      "__FUB_OAUTH_SYSTEM_NAME__": os.environ["FUB_OAUTH_SYSTEM_NAME"],
                  }
              )

          template_path = Path("deploy/ecs/task-definition.template.json")
          rendered_path = Path("deploy/ecs/task-definition.rendered.json")
          task_definition = json.loads(template_path.read_text(encoding="utf-8"))
          if oauth_enabled == "false":
              oauth_environment_names = {
                  "FOLLOWUPBOSS_FUB_OAUTH_CLIENT_ID",
                  "FOLLOWUPBOSS_FUB_OAUTH_AUTHORIZE_URL",
                  "FOLLOWUPBOSS_FUB_OAUTH_TOKEN_URL",
                  "FOLLOWUPBOSS_FUB_OAUTH_CALLBACK_URL",
                  "FOLLOWUPBOSS_FUB_OAUTH_SYSTEM_NAME",
              }
              oauth_secret_names = {
                  "FOLLOWUPBOSS_FUB_OAUTH_CLIENT_SECRET",
                  "FOLLOWUPBOSS_FUB_OAUTH_SYSTEM_KEY",
              }
              container = task_definition["containerDefinitions"][0]
              container["environment"] = [
                  item
                  for item in container["environment"]
                  if item.get("name") not in oauth_environment_names
              ]
              container["secrets"] = [
                  item for item in container["secrets"] if item.get("name") not in oauth_secret_names
              ]

          rendered_task_definition = replace_placeholders(task_definition, replacements)
          rendered_text = json.dumps(rendered_task_definition, indent=2) + "\n"
          missing = sorted(set(re.findall(r"__[A-Z0-9_]+__", rendered_text)))
          if missing:
              raise SystemExit(f"Unrendered ECS placeholders remain: {missing}")
          rendered_path.write_text(rendered_text, encoding="utf-8")
          PY

      - name: Register ECS task definition
        id: register-task
        shell: bash
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://deploy/ecs/task-definition.rendered.json \
            --region "${AWS_REGION}" > "${RUNNER_TEMP}/task-definition.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RUNNER_TEMP"], "task-definition.json").read_text(encoding="utf-8"))
          task_definition_arn = payload["taskDefinition"]["taskDefinitionArn"]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output_file:
              output_file.write(f"task_definition_arn={task_definition_arn}\n")
          PY

      - name: Deploy ECS service
        shell: bash
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${{ steps.register-task.outputs.task_definition_arn }}" \
            --force-new-deployment \
            --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true}" \
            --region "${AWS_REGION}" > "${RUNNER_TEMP}/deployment-request.json"
          jq -e --arg expected "${{ steps.register-task.outputs.task_definition_arn }}" '
            .service.taskDefinition == $expected
          ' "${RUNNER_TEMP}/deployment-request.json" > /dev/null
          printf "Deployment requested for release %s.\n" "${GITHUB_SHA}"

      - name: Wait for service stability
        shell: bash
        run: |
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}"

      - name: Verify the deployed ECS release
        shell: bash
        env:
          EXPECTED_TASK_DEFINITION: ${{ steps.register-task.outputs.task_definition_arn }}
        run: |
          aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}" --region "${AWS_REGION}" > "${RUNNER_TEMP}/deployed-service.json"
          service_count="$(jq -r '.services | length' "${RUNNER_TEMP}/deployed-service.json")"
          failure_count="$(jq -r '.failures | length' "${RUNNER_TEMP}/deployed-service.json")"
          desired="$(jq -r '.services[0].desiredCount // 0' "${RUNNER_TEMP}/deployed-service.json")"
          running="$(jq -r '.services[0].runningCount // 0' "${RUNNER_TEMP}/deployed-service.json")"
          pending="$(jq -r '.services[0].pendingCount // 0' "${RUNNER_TEMP}/deployed-service.json")"
          deployments="$(jq -r '.services[0].deployments | length' "${RUNNER_TEMP}/deployed-service.json")"
          rollout_state="$(jq -r '.services[0].deployments[0].rolloutState // empty' "${RUNNER_TEMP}/deployed-service.json")"
          deployed_task_definition="$(jq -r '.services[0].taskDefinition // empty' "${RUNNER_TEMP}/deployed-service.json")"
          if [ "${service_count}" != "1" ] || [ "${failure_count}" != "0" ] ||
             [ "${desired}" = "0" ] || [ "${running}" != "${desired}" ] ||
             [ "${pending}" != "0" ] || [ "${deployments}" != "1" ] ||
             [ "${rollout_state}" != "COMPLETED" ] ||
             [ "${deployed_task_definition}" != "${EXPECTED_TASK_DEFINITION}" ]; then
            printf "ECS did not converge on the requested release.\n" >&2
            exit 1
          fi
          aws ecs list-tasks --cluster "${ECS_CLUSTER}" --service-name "${ECS_SERVICE}" --desired-status RUNNING --max-results 100 --region "${AWS_REGION}" > "${RUNNER_TEMP}/deployed-task-arns.json"
          listed="$(jq -r '.taskArns | length' "${RUNNER_TEMP}/deployed-task-arns.json")"
          next_token="$(jq -r '.nextToken // empty' "${RUNNER_TEMP}/deployed-task-arns.json")"
          if [ "${listed}" != "${desired}" ] || [ -n "${next_token}" ]; then
            printf "ECS did not return the complete deployed task set.\n" >&2
            exit 1
          fi
          jq -r '.taskArns[]' "${RUNNER_TEMP}/deployed-task-arns.json" > "${RUNNER_TEMP}/deployed-task-arns.txt"
          aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks $(<"${RUNNER_TEMP}/deployed-task-arns.txt") --region "${AWS_REGION}" > "${RUNNER_TEMP}/deployed-tasks.json"
          described="$(jq -r '.tasks | length' "${RUNNER_TEMP}/deployed-tasks.json")"
          task_failures="$(jq -r '.failures | length' "${RUNNER_TEMP}/deployed-tasks.json")"
          mismatches="$(jq --arg expected "${EXPECTED_TASK_DEFINITION}" '[.tasks[] | select(.lastStatus != "RUNNING" or .taskDefinitionArn != $expected)] | length' "${RUNNER_TEMP}/deployed-tasks.json")"
          if [ "${described}" != "${desired}" ] || [ "${task_failures}" != "0" ] ||
             [ "${mismatches}" != "0" ]; then
            printf "Not every running task uses the requested release.\n" >&2
            exit 1
          fi
          printf "ECS deployment receipt: release=%s task_definition=%s desired=%s running=%s.\n" \
            "${GITHUB_SHA}" "${deployed_task_definition}" "${desired}" "${running}"

      - name: Verify public OAuth metadata and bearer challenge
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          resource = os.environ["HOSTED_RESOURCE_SERVER_URL"]
          raw_issuer = os.environ["HOSTED_ISSUER_URL"].strip()
          split = urlsplit(resource)
          issuer_split = urlsplit(raw_issuer)
          if (
              issuer_split.scheme != "https"
              or issuer_split.netloc != split.netloc
              or issuer_split.username is not None
              or issuer_split.password is not None
              or issuer_split.path not in ("", "/")
              or issuer_split.query
              or issuer_split.fragment
          ):
              raise SystemExit("Configured issuer is not the MCP HTTPS origin.")
          origin = f"{split.scheme}://{split.netloc}"
          issuer = f"{issuer_split.scheme}://{issuer_split.netloc}/"
          protected_url = f"{origin}/.well-known/oauth-protected-resource{split.path}"
          authorization_url = f"{issuer}.well-known/oauth-authorization-server"

          try:
              urlopen(Request(resource, headers={"Accept": "application/json"}), timeout=15)
          except HTTPError as exc:
              if exc.code != 401:
                  raise SystemExit(f"MCP bearer challenge returned HTTP {exc.code}.") from exc
              challenge = exc.headers.get("WWW-Authenticate", "")
          else:
              raise SystemExit("MCP endpoint did not require a bearer token.")
          if protected_url not in challenge:
              raise SystemExit("MCP bearer challenge advertised the wrong metadata URL.")

          with urlopen(protected_url, timeout=15) as response:
              protected = json.load(response)
          with urlopen(authorization_url, timeout=15) as response:
              authorization = json.load(response)
          if protected.get("resource") != resource:
              raise SystemExit("Protected-resource metadata advertised the wrong resource.")
          if issuer not in protected.get("authorization_servers", []):
              raise SystemExit("Protected-resource metadata advertised the wrong issuer.")
          if authorization.get("issuer") != issuer:
              raise SystemExit("Authorization metadata advertised the wrong issuer.")
          if authorization.get("authorization_response_iss_parameter_supported") is not True:
              raise SystemExit("Authorization metadata did not advertise RFC 9207 issuer binding.")
          if authorization.get("client_id_metadata_document_supported") is not True:
              raise SystemExit("Authorization metadata did not advertise CIMD support.")
          print("Public OAuth metadata receipt: resource, issuer, RFC 9207, and CIMD verified.")
          PY
