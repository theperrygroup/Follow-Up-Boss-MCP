name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Scan for secrets
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            log_opts="origin/${GITHUB_BASE_REF}..HEAD"
          elif [ -n "${EVENT_BEFORE}" ] && [ "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            log_opts="${EVENT_BEFORE}..${GITHUB_SHA}"
          else
            log_opts="-1"
          fi
          gitleaks detect --source . --log-opts="${log_opts}" --redact --verbose --config .gitleaks.toml

  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-2025-vs2026
            python-version: "3.12"
          - os: windows-2025-vs2026
            python-version: "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run validation wrapper
        if: runner.os != 'Windows'
        run: make validate

      - name: Run validation steps on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          uv sync --frozen
          uv export --format requirements.txt --all-groups --locked --no-editable --no-emit-project --output-file "$RUNNER_TEMP/followupboss-mcp-requirements.txt"
          uvx --from pip-audit pip-audit -r "$RUNNER_TEMP/followupboss-mcp-requirements.txt" --strict --disable-pip --no-deps
          uv run python scripts/validate_docs_links.py
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src tests
          uv run pytest
          uv run coverage run --branch -m pytest
          uv run coverage report --fail-under=100
          uv run python -m followupboss_mcp.cli --help

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-2025-vs2026
            python-version: "3.12"
    needs:
      - secrets
      - quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Build and validate artifacts
        if: runner.os != 'Windows'
        run: make build-smoke

      - name: Build and validate artifacts on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          uv build --clear
          uv run python scripts/validate_build_artifacts.py
